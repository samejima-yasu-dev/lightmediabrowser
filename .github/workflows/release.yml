name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    env:
      QT_LICENSE_DIR: build/qt-license-texts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare Qt license texts
        run: node tools/fetch-qt-licenses.mjs "$env:QT_LICENSE_DIR"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: .\tools\package-windows.ps1 -BuildDirectory build/Release -QtRoot $env:QT_ROOT_DIR -OutputDirectory dist

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LightMediaBrowser-windows-x64
          path: dist/LightMediaBrowser-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      QT_LICENSE_DIR: build/qt-license-texts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Prepare Qt license texts
        run: node tools/fetch-qt-licenses.mjs "$QT_LICENSE_DIR"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: bash tools/package-macos.sh build "${{ matrix.arch }}" dist

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: LightMediaBrowser-macos-${{ matrix.arch }}
          path: dist/LightMediaBrowser-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-appimage:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-tools-dev \
            libsqlite3-dev \
            ffmpeg \
            wget

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install to AppDir
        run: |
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr

      - name: Download linuxdeploy
        run: |
          mkdir -p tools
          wget -O tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy-plugin-qt
        run: |
          wget -O tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Deploy dependencies
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/lightmediabrowser.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/lightmediabrowser.png \
            --executable /usr/bin/ffmpeg \
            --executable /usr/bin/ffprobe

      - name: Deploy Qt
        run: |
          ./tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            --appdir AppDir

      - name: Include dependency license texts
        run: |
          license_dir="AppDir/usr/share/doc/lightmediabrowser/third-party"
          mkdir -p "$license_dir"
          dpkg-query -W -f='${binary:Package}\n' \
            | grep -E '^(ffmpeg|libav|libsw|libpostproc|libqt6|qt6-|libsqlite3)' \
            | while IFS= read -r package; do
                package_name="${package%%:*}"
                source="/usr/share/doc/$package_name/copyright"
                if [ -f "$source" ]; then
                  cp "$source" "$license_dir/$package_name.copyright"
                fi
              done
          test -s AppDir/usr/share/doc/lightmediabrowser/LICENSE
          test -s AppDir/usr/share/doc/lightmediabrowser/THIRD_PARTY_NOTICES.md
          test -x AppDir/usr/bin/ffmpeg
          test -x AppDir/usr/bin/ffprobe

      - name: Build AppImage
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LightMediaBrowser-AppImage
          path: "*.AppImage"
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-appimage
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: LightMediaBrowser-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.AppImage
            release-assets/*.zip
            release-assets/*.dmg
          generate_release_notes: true
